# DocIntel Integration Test Queries
# ------------------------------------
# Each suite maps to a dataset domain.
#
# Fields per query:
#   expect_keywords    — soft keyword check; keywords checked in answer + source text
#   expect_abstention  — true when the corpus should NOT contain an answer (abstention-correct metric)
#   relevant_docs      — list of filename substrings expected in retrieved sources (retrieval metrics)
#   ground_truth       — reference answer text (used by LLM judge for faithfulness/relevancy)
#
# Retrieval and generation metrics require --metrics flag in run_tests.py.

config:
  base_url: "http://localhost:8080"   # api-gateway; swap to :8000 for direct rag-service
  rag_path: "/api/v1/query/stream"
  tenant_id: "e2e"
  use_reranking: true
  use_cache: false
  timeout_seconds: 180
  # Minimum answer length to pass. Factual answers can be short and correct —
  # set low; use expect_keywords for quality signal instead.
  min_answer_length: 5

  # Reranker health check (checked in pre-flight when use_reranking is true).
  reranker_url: "http://localhost:11430/v1"
  reranker_model: "qwen3-reranker:0.6b:8bit"

  # LLM judge for --metrics mode (uses LMForge qwen3.5 by default).
  judge_url: "http://localhost:11430/v1"
  judge_model: "qwen3.5:4b:6bit"

  # Auth via JWT Bearer grant (RFC 7523) — industry standard for CI / automated tests.
  # run_tests.py loads the E2E SA private key from config/zitadel/e2e-sa-key.json
  # (auto-generated by Terraform, written by start.sh, git-ignored).
  # Override key path via E2E_SA_KEY_FILE env var.
  # Pass --no-auth to disable entirely (only works if gateway security is off).
  auth:
    token_url: "http://localhost:9095/oauth/v2/token"
    scopes: "openid email profile"

  # G1: per-dataset seed sizes for setup_e2e_environment. Chosen from actual
  # source-corpus keyword archaeology (see tasks/05-2026-gaps-plan.md G1) so
  # every expect_abstention:false query below has a real covering document:
  #   hr_policies (644 rows, syncora/hr-policies-qa-dataset): harassment-reporting
  #     content lands at ~row 472, complaints-committee (PCC) content at ~row 539 —
  #     600 clears both with margin, comfortably under the 644-row ceiling.
  #   techqa (2647 rows, m-ric/huggingface_doc): all 6 technical topics resolve
  #     by row ~71 (transformers Trainer docs) — 100 gives 30% margin.
  #   cuad (510 unique contracts): non-compete is the rarest of our 7 clause
  #     types — absent in the first 5 titles, present by title #10 — 15 gives margin.
  # Re-verify with calibrate_threshold.py / a --retrieval-only pass if the
  # upstream datasets change.
  seed_samples:
    hr_policies: 600
    techqa: 100
    cuad: 15

  # G3: CI evaluation gate thresholds — see run_tests.py --gate.
  # hit_at_k / abstention_correct are computed from retrieval+rerank alone
  # (no LLM judge needed) — these are what CI can actually gate without
  # LMForge. faithfulness_min only applies when the judge ran (--metrics
  # locally/nightly); CI skips it entirely (no judge, see integration-tests.yml).
  #
  # abstention_correct_min_retrieval_only is deliberately lower than
  # abstention_correct_min (full mode). --retrieval-only judges abstention
  # from source_count alone (no generated text to check) — but 3 of the G1
  # near-miss queries are *designed* to be embedding-adjacent to real docs
  # (e.g. "TensorRT-LLM deployment" vs. corpus content on TGI/inference
  # optimization), so the reranker legitimately returns sources for them
  # even though the LLM correctly abstains once it reads them ("the context
  # doesn't mention TensorRT-LLM" — verified manually, see G1 commit). That's
  # the RAG_PROMPT_TEMPLATE's groundedness instruction doing its job at the
  # generation layer, which --retrieval-only can't see.
  # Measured on the current golden set at tau=0.55 (34 queries: 20 answerable
  # + 14 abstain): pooled abstention_correct_rate = 31/34 = 0.912 — clears
  # 0.9 today, but only 3 wrong answers of margin given 3 known-hard
  # near-misses sit just above tau (0.65-0.72). Floor set to 0.75 so normal
  # reranker/model-version noise on those 3 doesn't flap CI red without an
  # actual pipeline regression. Full mode (--metrics) is the authoritative
  # abstention check (verified: LLM correctly abstains on all 3) and keeps
  # the original 0.9 bar.
  gate:
    hit_at_k_min: 0.9
    abstention_correct_min: 0.9
    abstention_correct_min_retrieval_only: 0.75
    # Regression floor, not a target. Measured baseline (Aug 2026 full-gate
    # runs, qwen3.5:4b generator + ragas judge): HR ~1.0, technical ~0.7,
    # CUAD contracts 0.2–0.4 — redaction placeholders ([ * ], [***]) make
    # claims about redacted values unverifiable for ANY judge (cross-checked
    # with qwen3.5:9b, which scores the same answers equal or lower), so the
    # blended average lands ~0.6. 0.5 catches genuine grounding collapse
    # without failing on the structural CUAD ceiling. Raise if the contracts
    # dataset is swapped for unredacted corpora or a stronger generator ships.
    faithfulness_min: 0.5
    allow_reranker_degraded: false

suites:

  - name: "HR Policies"
    document_type: "hr_policy"
    queries:
      # Kreeda Labs DOES have a WFH/remote-work policy in the underlying HF
      # corpus (syncora/hr-policies-qa-dataset, rows ~371-384) — it just wasn't
      # in the old 5-doc seed. With seed_samples.hr_policies=600 it's now
      # covered, so this flips from abstention to answerable (G1 correction —
      # was previously mislabeled because the old seed happened to exclude it).
      - question: "What is the work from home policy?"
        expect_keywords: ["work from home"]
        expect_abstention: false
        relevant_docs: ["hr_policy"]
        ground_truth: "Kreeda Labs' WFH policy is built on trust, flexibility, and accountability — employees must maintain a secure home workspace, stay reachable during working hours, and follow escalating consequences for repeated policy violations."

      - question: "What are the consequences of not complying with the code of conduct?"
        expect_keywords: ["conduct", "disciplin"]
        expect_abstention: false
        relevant_docs: ["hr_policy"]

      - question: "What should I do if I experience workplace harassment?"
        expect_keywords: ["harassment", "report"]
        expect_abstention: false
        relevant_docs: ["hr_policy"]

      - question: "How do I submit a workplace complaint?"
        expect_keywords: ["complaint"]
        expect_abstention: false
        relevant_docs: ["hr_policy"]

      # Work-life balance IS covered — should answer, not abstain.
      - question: "What is Kreeda Labs' work-life balance policy?"
        expect_keywords: ["work-life", "balance"]
        expect_abstention: false
        relevant_docs: ["hr_policy"]
        ground_truth: "Kreeda Labs encourages employees to manage tasks within regular working hours to promote work-life balance and prevent burnout."

      # --- Near-miss abstention queries (G1) ---
      # Plausible HR topics that are genuinely absent from the entire 644-row
      # syncora/hr-policies-qa-dataset (verified by full-corpus keyword scan,
      # not just the seeded subset) — raising seed_samples further will not
      # make these answerable, so abstention is the durable correct answer.
      - question: "How many days of annual leave am I entitled to?"
        expect_keywords: ["annual leave"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There is no stated annual-leave day entitlement in the available documents (only compensatory-off and generic leave-reporting procedures are covered)."

      - question: "What is the process for requesting parental leave?"
        expect_keywords: ["parental leave"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There is no parental leave policy in the available documents."

      # NOTE: an earlier draft used "probation period performance evaluation" and
      # "maternity leave policy at Kreeda Labs" here. Both turned out to be poor
      # near-misses for a *retrieval-score* gate (not an LLM judge): the corpus
      # is saturated with generic "performance review" and "policy at Kreeda
      # Labs" meta-Q&A (who drafted it, who approved it, contact email...), so
      # the embedder/reranker scored them at the same ceiling (~0.73) as true
      # positives — topically uncovered, but not *embedding-distant* from real
      # docs, so no tau could separate them (see tau=0 calibration evidence in
      # the G1 commit). Replaced with topics that are both uncovered AND
      # embedding-distant, confirmed via the same tau=0 pass.
      - question: "Does the company offer stock options or equity compensation to employees?"
        expect_keywords: ["stock option", "equity"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There is no stock options or equity compensation policy in the available documents."

      - question: "What is the policy on compassionate leave following a family bereavement?"
        expect_keywords: ["compassionate", "bereavement"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There is no compassionate/bereavement leave policy in the available documents."

      - question: "What is the formal grievance redressal procedure?"
        expect_keywords: ["grievance"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There is no formal grievance redressal procedure documented (only the POSH Presiding Complaints Committee process is covered, which is a different, narrower mechanism)."

  - name: "Technical"
    # Source: m-ric/huggingface_doc — HuggingFace library documentation
    # (Transformers, Datasets, Gradio, Hub, Evaluate, etc.)
    document_type: "technical"
    queries:
      - question: "How do I load a dataset using the HuggingFace datasets library?"
        expect_keywords: ["load_dataset", "dataset", "split"]
        expect_abstention: false
        relevant_docs: ["technical"]

      - question: "How do I fine-tune a pre-trained transformer model?"
        expect_keywords: ["fine-tune", "train", "model"]
        expect_abstention: false
        relevant_docs: ["technical"]

      - question: "How do I create a Gradio demo for my machine learning model?"
        expect_keywords: ["gradio", "interface", "demo"]
        expect_abstention: false
        relevant_docs: ["technical"]

      - question: "How do I push a model to the HuggingFace Hub?"
        expect_keywords: ["push", "hub", "repository"]
        expect_abstention: false
        relevant_docs: ["technical"]

      - question: "What is the difference between AutoModel and pipeline in Transformers?"
        expect_keywords: ["pipeline", "AutoModel", "model"]
        expect_abstention: false
        relevant_docs: ["technical"]

      - question: "How do I evaluate a model using the evaluate library?"
        expect_keywords: ["evaluate", "metric", "score"]
        expect_abstention: false
        relevant_docs: ["technical"]

      # --- Near-miss abstention queries (G1) ---
      # Plausible-sounding HF-ecosystem questions with zero coverage in the
      # seeded m-ric/huggingface_doc slice (seed_samples.techqa=100). "blockchain"
      # has zero hits anywhere in the full 2647-row corpus; tensorrt/kubernetes
      # content exists but only past row ~150, well outside the seeded range.
      - question: "How do I deploy a HuggingFace model with TensorRT-LLM for low-latency inference?"
        expect_keywords: ["tensorrt"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There is no TensorRT-LLM deployment guide in the available documents."

      - question: "How do I orchestrate multi-node distributed training with Kubernetes?"
        expect_keywords: ["kubernetes"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There is no Kubernetes orchestration guide in the available documents."

      - question: "How do I integrate a HuggingFace model with a blockchain smart contract for on-chain inference?"
        expect_keywords: ["blockchain"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There is no blockchain integration guide in the available documents."

  - name: "Contracts"
    document_type: "contracts"
    queries:
      - question: "What are the termination clauses in these contracts?"
        expect_keywords: ["terminat", "clause", "notice"]
        expect_abstention: false
        relevant_docs: ["contracts"]

      - question: "Who owns intellectual property developed under this agreement?"
        expect_keywords: ["intellectual property", "owner", "agreement"]
        expect_abstention: false
        relevant_docs: ["contracts"]

      - question: "What is the limitation of liability in this contract?"
        expect_keywords: ["liabilit", "limit", "damages"]
        expect_abstention: false
        relevant_docs: ["contracts"]

      - question: "Does this agreement include a non-compete or non-solicitation clause?"
        # "non-comp" matches both "non-compete" and "non-competition" (models
        # follow the source's inflection); "solicit" covers solicitation/soliciting.
        expect_keywords: ["non-comp", "solicit"]
        expect_abstention: false
        relevant_docs: ["contracts"]

      - question: "What are the indemnification obligations of each party?"
        expect_keywords: ["indemnif", "obligation", "party"]
        expect_abstention: false
        relevant_docs: ["contracts"]

      - question: "What are the payment terms and conditions?"
        expect_keywords: ["payment", "terms", "due"]
        expect_abstention: false
        relevant_docs: ["contracts"]

      - question: "Under what circumstances can the contract be renewed or extended?"
        expect_keywords: ["renew", "extend", "term"]
        expect_abstention: false
        relevant_docs: ["contracts"]

      # --- Near-miss abstention queries (G1) ---
      # Plausible contract-review topics absent from the first 15 CUAD titles
      # (seed_samples.cuad=15) — verified by keyword scan of the seeded slice.
      - question: "Does this agreement include GDPR or data privacy compliance obligations?"
        expect_keywords: ["gdpr", "data privacy"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There are no GDPR or data privacy compliance clauses in the available contracts."

      - question: "Are there any cryptocurrency or blockchain payment provisions in these contracts?"
        expect_keywords: ["cryptocurrency", "blockchain"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There are no cryptocurrency or blockchain payment provisions in the available contracts."

      - question: "Are there environmental compliance or carbon offset obligations in these contracts?"
        expect_keywords: ["environmental", "carbon"]
        expect_abstention: true
        relevant_docs: []
        ground_truth: "There are no environmental compliance or carbon offset obligations in the available contracts."

  # ---------------------------------------------------------------------------
  # Min Score Strict
  # T11: when no documents pass rag_min_relevance_score and fallback_topk=0
  # the service must return the no-relevant-documents sentinel rather than a
  # hallucinated answer.
  # To run: set RAG_MIN_RELEVANCE_SCORE=0.99 and RAG_MIN_SCORE_FALLBACK_TOPK=0
  # in the rag-service environment before running this suite.
  # ---------------------------------------------------------------------------
  - name: "Min Score Strict"
    skip_if_env_missing: ["ENABLE_MIN_SCORE_SUITE"]
    queries:
      - question: "Highly implausible query that will never match anything in the corpus xyzzy123"
        expect_no_sources: true
        expect_abstention: true
        relevant_docs: []
        expect_keywords: ["not find", "relevant", "no relevant"]

  # ---------------------------------------------------------------------------
  # Thinking Mode
  # T6b/T5: when thinking mode is enabled the API must return a non-empty
  # `thinking` field alongside the answer (the thinking tokens must not be
  # dropped or leaked into the answer body).
  # To run: set LLM_THINKING_MODE=true or send thinking=true in the request.
  # ---------------------------------------------------------------------------
  - name: "Thinking Mode"
    skip_if_env_missing: ["ENABLE_THINKING_SUITE"]
    config_overrides:
      thinking: true
    queries:
      - question: "What are the key principles of a good employee code of conduct?"
        expect_keywords: ["conduct", "employee", "principle"]
        expect_thinking_length_min: 10
        expect_abstention: false
        relevant_docs: ["hr_policy"]

      - question: "What termination conditions apply to standard vendor contracts?"
        expect_keywords: ["terminat", "contract", "vendor"]
        expect_thinking_length_min: 10
        expect_abstention: false
        relevant_docs: ["contracts"]

  # ---------------------------------------------------------------------------
  # Cache Hit
  # Verifies that the second identical request is served from the semantic cache
  # (cache_hit: true in the metadata event) and contains the same answer tokens.
  # run_tests.py fires each query twice and checks the second response.
  # ---------------------------------------------------------------------------
  - name: "Cache Hit"
    skip_if_env_missing: ["ENABLE_CACHE_SUITE"]
    config_overrides:
      use_cache: true
    queries:
      # G1: WFH is now answerable (see HR Policies suite) — use a genuine
      # near-miss abstention query here instead so cache-hit still exercises
      # the canned no-relevant-docs response path deterministically.
      - question: "What is the policy on compassionate leave following a family bereavement?"
        expect_cache_hit: true
        expect_keywords: ["compassionate", "bereavement"]
        expect_abstention: true

  # ---------------------------------------------------------------------------
  # OPA Denied (Streaming security gap regression)
  # Proves that the streaming path now enforces OPA — previously the streaming
  # handler skipped OpaChunkValidator entirely (security gap closed by A6).
  #
  # The test user "e2e" must NOT have clearance for "secret" classification.
  # Documents ingested with classification=secret should be denied.
  #
  # To run: set ENABLE_OPA_DENIED_SUITE=1 and ensure at least one document
  # with classification=secret exists in the tenant corpus.
  # The suite uses /query/stream to specifically prove the streaming path.
  # ---------------------------------------------------------------------------
  - name: "OPA Denied"
    skip_if_env_missing: ["ENABLE_OPA_DENIED_SUITE"]
    config_overrides:
      rag_path: "/api/v1/query/stream"
    queries:
      - question: "What is in the classified documents?"
        expect_opa_denied: true
        expect_no_sources: true
        expect_abstention: true
        expect_keywords: ["not find", "relevant", "no relevant"]
