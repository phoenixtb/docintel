[project]
name = "docintel-integration-tests"
version = "0.1.0"
description = "DocIntel E2E / integration test harness"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "PyJWT[crypto]>=2.9",

    # G4: LLM-judge layer (faithfulness + answer_relevancy), moved here from
    # rag-service/pyproject.toml (evaluation is a test-time concern, not a
    # runtime dependency). Pinned to the exact version live-verified against
    # the LMForge judge (qwen3.5:4b:6bit) — see tasks/05-2026-gaps-plan.md G4.
    # langchain-community must be pinned below 0.3.20: ragas 0.4.3 imports
    # `langchain_community.chat_models.vertexai`, which newer
    # langchain-community releases (0.4.x) removed — an unpinned install
    # resolves the latest langchain-community and breaks on import.
    "ragas==0.4.3",
    "langchain-community<0.3.20",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
