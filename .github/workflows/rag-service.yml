# RAG Service CI - Path Filtered
# ================================
# Only runs when rag-service files change

name: RAG Service

on:
  push:
    branches: [main]
    paths:
      - 'services/rag-service/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/rag-service/**'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/rag-service

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check src/
          uv run ruff format --check src/

      - name: Type check
        run: uv run mypy src/ --ignore-missing-imports

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src --cov-report=xml

      # The Dockerfile copies lib/docintel-common, so the build context is the
      # repo root (same as ci.yml's docker-build matrix).
      - name: Build Docker image
        working-directory: .
        run: docker build -f services/rag-service/Dockerfile -t docintel/rag-service:${{ github.sha }} .
