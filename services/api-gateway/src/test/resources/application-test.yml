# Test profile. Routes are the production ones from application.yml; tests point
# their *_SERVICE_URL placeholders, the OPA URL, the JWKS URI, Redis and
# INTERNAL_GATEWAY_SECRET at WireMock / Testcontainers via @DynamicPropertySource
# (see support/GatewayTestInfra.kt).
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Overridden per test class; the JWT-chain beans read jwk-set-uri at startup.
          issuer-uri: http://localhost:9999
          jwk-set-uri: http://localhost:9999/oauth/v2/keys

management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.docintel: DEBUG
    org.springframework.cloud.gateway: INFO
