spring:
  application:
    name: admin-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docint}
    username: ${SPRING_DATASOURCE_USERNAME:docint}
    password: ${SPRING_DATASOURCE_PASSWORD:docint_secret}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false  # Managed programmatically in TenantDataSourceConfig

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8082

# Qdrant Configuration
qdrant:
  url: ${QDRANT_URL:http://localhost:6333}
  embedding-dim: 768


# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false

# Zitadel API for tenant/user management (AGPL v3.0 — self-hosted)
zitadel:
  url: ${ZITADEL_URL:http://localhost:9090}
  pat: ${ZITADEL_SERVICE_ACCOUNT_PAT:}
  project-id: ${ZITADEL_PROJECT_ID:}

# S3-compatible object store (ObjectStoreProperties) for per-tenant bucket provisioning.
# Credentials have no defaults: a missing OBJECT_STORE_ACCESS_KEY / _SECRET_KEY fails startup.
object-store:
  endpoint: ${OBJECT_STORE_ENDPOINT:http://localhost:19000}
  region: ${OBJECT_STORE_REGION:us-east-1}
  access-key: ${OBJECT_STORE_ACCESS_KEY:}
  secret-key: ${OBJECT_STORE_SECRET_KEY:}
  force-path-style: ${OBJECT_STORE_FORCE_PATH_STYLE:true}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:}

# OpenAPI export — /v3/api-docs is scraped by scripts/generate-openapi.sh and
# merged into docs/api/openapi.json. Swagger UI kept for local dev convenience.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging
logging:
  level:
    com.docintel: DEBUG
